<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'">
  <meta name="color-scheme" content="dark light">
  <title>AXIOM Ω</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- sdílené gradienty značky (titan) – používá je inline logo v hlavičce, zprávách a navigaci -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gL" x1="140" y1="340" x2="256" y2="120" gradientUnits="userSpaceOnUse">
        <stop offset="0" style="stop-color:var(--ti3)"/><stop offset=".45" style="stop-color:var(--ti2)"/><stop offset="1" style="stop-color:var(--ti1)"/>
      </linearGradient>
      <linearGradient id="gR" x1="256" y1="120" x2="390" y2="340" gradientUnits="userSpaceOnUse">
        <stop offset="0" style="stop-color:var(--ti2)"/><stop offset=".3" style="stop-color:var(--ti4)"/><stop offset=".55" style="stop-color:var(--ti1)"/><stop offset=".8" style="stop-color:var(--ti3)"/><stop offset="1" style="stop-color:var(--ti2)"/>
      </linearGradient>
      <linearGradient id="gA" x1="58" y1="0" x2="454" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" style="stop-color:var(--ti1);stop-opacity:0"/><stop offset=".5" style="stop-color:var(--ti1)"/><stop offset="1" style="stop-color:var(--ti1);stop-opacity:0"/>
      </linearGradient>
      <radialGradient id="gF" cx="256" cy="330" r="46" gradientUnits="userSpaceOnUse">
        <stop offset="0" style="stop-color:var(--ti1)"/><stop offset=".25" style="stop-color:var(--ti1);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--ti1);stop-opacity:0"/>
      </radialGradient>
    </defs>
  </svg>

  <header class="top">
    <button class="icon-btn" id="btnThreads" aria-label="Vlákna">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
    </button>
    <div class="brand" id="brand"></div>
    <button class="chip" id="engineChip" aria-label="Volba mozku"><span class="dot" id="engineDot"></span><span id="engineText">AUTO</span></button>
  </header>

  <main id="main"></main>
  <div id="composerSlot"></div>

  <nav class="tabs" id="tabs"></nav>

  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer"></aside>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
