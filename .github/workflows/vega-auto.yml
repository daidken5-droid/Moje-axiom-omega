name: VEGA samoúprava (vega/auto-*)

# Kód na těchto větvích napsala VEGA sama (model). Proto:
#  - spouští se PUSHEM na vega/auto-* (ne pull requestem): běh vidí jen cache své větve a výchozí větve, ne cache
#    pracovní větve; workflow AVIORu (pull_request) se nespustí,
#  - job „build“ testuje a sestavuje BEZ jakýchkoli secrets a bez klíče (kód nemá co ukrást),
#  - hlídač: jen povolené cesty, bez přejmenování, jen běžné soubory (žádné symlinky), žádná citlivá API v přidaných řádcích,
#  - job „sign“ podepisuje JEN klíčem z prostředí „vega-sign“ (secrets prostředí nevidí job s kódem z větve)
#    a nespouští žádný kód z větve (žádný checkout).
# Token v telefonu NEMÁ oprávnění Workflows → tento soubor z telefonu změnit nejde.
on:
  push:
    branches: ["vega/auto-**"]

permissions:
  contents: read

concurrency:
  group: vega-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Hlídač + testy + sestavení (bez klíčů)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Hlídač cest, typů souborů a citlivých API
        run: |
          git diff --no-renames --name-only HEAD~1 HEAD | tee changed.txt
          ok='^(vega/src/main/java/|vega/src/main/assets/ui/|vegacore/src/main/kotlin/|vegacore/src/test/kotlin/|vega/src/test/java/)'
          bad=$(grep -vE "$ok" changed.txt || true)
          prot=$(grep -E '(/Store\.kt|/MainActivity\.kt|/net/Http\.kt|/core/Extensions\.kt|/VegaApp\.kt)$|/selfupdate/' changed.txt || true)
          modes=$(git diff --no-renames --raw HEAD~1 HEAD | awk '{print $2}' | grep -vE '^(100644|000000)$' || true)
          sens=$(git diff --no-renames -U0 HEAD~1 HEAD | grep -E '^\+[^+]' | grep -iE '(vault|keystore|getSharedPreferences|Http\.(open|request|download|get)|HttpURLConnection|URLConnection|java\.net\.|Socket|Runtime\.getRuntime|ProcessBuilder|addJavascriptInterface|evaluateJavascript|loadUrl|XMLHttpRequest|WebSocket|EventSource|importScripts|fetch[[:space:]]*\(|new[[:space:]]+Worker|postMessage|eval[[:space:]]*\(|new[[:space:]]+Function|selfupdate|GitHub\(|REQUEST_INSTALL|PackageInstaller|DexClassLoader|System\.loadLibrary|Class\.forName|reflect)' || true)
          if [ -n "$bad$prot$modes$sens" ]; then
            echo "::error::Samoúprava porušila pravidla."; echo "Mimo povolené cesty: $bad"; echo "Chráněné soubory: $prot"; echo "Nepovolený typ souboru: $modes"; echo "Citlivá API: $sens"; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Testy
        run: ./gradlew :vegacore:test :vega:testDebugUnitTest --no-daemon
      - name: Výsledky testů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vega-test-results
          path: |
            vegacore/build/reports/tests/test
            vega/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - name: Sestavení (bez produkčního klíče)
        run: ./gradlew :vega:assembleRelease --no-daemon -PvegaVersionCode=$(( ( $(date +%s) - 1767225600 ) / 60 )) -PvegaVersionSuffix=auto-${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: vega/build/outputs/apk/release/vega-release.apk
          retention-days: 1

  sign:
    name: Podpis klíčem z prostředí vega-sign (bez kódu z větve)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vega-sign
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned
      - name: Podepsat, otisky
        env:
          KS_B64: ${{ secrets.VEGA_SIGN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VEGA_SIGN_PASSWORD }}
          KS_ALIAS: ${{ secrets.VEGA_SIGN_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Chybí podpisový klíč v prostředí vega-sign (VEGA_SIGN_KEYSTORE_B64, VEGA_SIGN_PASSWORD, VEGA_SIGN_ALIAS) – viz docs/vega/AUTONOMIE.md."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/k.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist; OUT="dist/VEGA-${GITHUB_SHA::7}.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/k.p12" --ks-type PKCS12 --ks-key-alias "${KS_ALIAS:-avior}" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out "$OUT" vega-release.apk
          rm -f "$RUNNER_TEMP/k.p12" dist/*.idsig
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          "$BT/apksigner" verify --print-certs "$OUT" | tee dist/SIGNING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VEGA-APK
          path: dist/
          retention-days: 30
