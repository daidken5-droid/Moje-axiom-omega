name: CRUCIBLE – Android emulátor (běhové testy)

# Skutečný Android 14 (x86_64, KVM) na GitHub runneru: instrumentační testy (UI → most → služba → reflex → DB,
# znovuvytvoření aktivity, migrace SQLite) + smoke přes ADB (studený/teplý start, paměť, otočení, ukončení procesu,
# paměťový tlak, pády/ANR, chyby JS). Měří emulátor – NE výkon fyzického telefonu ani rychlost inference.
on:
  push:
    branches: ["**"]
    paths: ["app/**", "core/src/main/**", "tools/crucible/**", ".github/workflows/emulator.yml", "build.gradle.kts", "settings.gradle.kts"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  # nerušit běžící běh: jeho log je důkaz (zrušený běh log nevydá); nový běh počká ve frontě
  cancel-in-progress: false

jobs:
  emulator:
    name: Emulátor API 34 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: NDK 27.2 + CMake 3.22.1
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Sestavení debug APK + testů (x86_64, llama.cpp pro emulátor)
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pomega.abis=x86_64 --no-daemon
      - name: Emulátor – instrumentační testy + smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          # běhy #1 a #4: emulátor (qemu) potichu skončil ~2 min po startu instrumentace během vykreslování WebView
          # se swiftshader_indirect → experiment: vykreslování uvnitř hosta (-gpu guest) + crash data níže
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          script: tools/crucible/run_emulator_ci.sh
      - name: Souhrn
        if: always()
        run: cat crucible-runtime.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(bez výsledku)" >> "$GITHUB_STEP_SUMMARY"
      - name: Výsledky
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crucible-emulator
          path: |
            crucible-runtime.md
            instrumentation.log
            logcat-instrumentation.txt
            host-monitor.log
            /tmp/android-runner
            smoke.md
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          retention-days: 14
