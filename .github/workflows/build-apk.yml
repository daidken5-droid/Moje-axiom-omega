name: Build AXIOM Ω APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testy jádra (RANDY, STEP-0, enginy, mozky, balíčky)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit testy
        run: ./gradlew :core:test --no-daemon
      - name: Výsledky testů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/build/reports/tests/test
          retention-days: 7

  apk:
    name: APK (llama.cpp arm64-v8a)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK 27.2 + CMake 3.22.1
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Release keystore (volitelné, z GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.OMEGA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/omega.jks"
            echo "OMEGA_KEYSTORE_PATH=$RUNNER_TEMP/omega.jks" >> "$GITHUB_ENV"
          fi
      - name: Sestavení APK
        env:
          OMEGA_KEYSTORE_PASSWORD: ${{ secrets.OMEGA_KEYSTORE_PASSWORD }}
          OMEGA_KEY_ALIAS: ${{ secrets.OMEGA_KEY_ALIAS }}
          OMEGA_KEY_PASSWORD: ${{ secrets.OMEGA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon -Pomega.abis=arm64-v8a
      - name: Pojmenování
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AXIOM-Omega-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AXIOM-Omega-${GITHUB_SHA::7}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          unzip -l dist/AXIOM-Omega-*-debug.apk | grep -E "lib/arm64-v8a/.*\.so" || (echo "Chybí nativní knihovny" && exit 1)
      - name: APK ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-Omega-APK
          path: dist/
          retention-days: 30

  release:
    name: Vydání na GitHubu (tagy v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AXIOM-Omega-APK
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
